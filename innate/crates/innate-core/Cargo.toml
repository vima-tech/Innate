[package]
name        = "innate-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Innate — self-growing procedural knowledge layer"
default-run = "innate"

[[bin]]
name = "innate"
path = "src/main.rs"

[lib]
name = "innate_core"
path = "src/lib.rs"

[dependencies]
rusqlite.workspace   = true
serde.workspace      = true
serde_json.workspace = true
uuid.workspace       = true
chrono.workspace     = true
thiserror.workspace  = true
sha2.workspace       = true
tokio.workspace      = true
clap.workspace       = true
anyhow.workspace     = true
tracing.workspace    = true
dirs-next            = "2"

[dev-dependencies]
tempfile = "3"
