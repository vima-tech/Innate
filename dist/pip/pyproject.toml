[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "innate-ai"
version = "0.1.8"
description = "Self-growing procedural knowledge layer for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["innate", "mcp", "ai", "knowledge", "agent", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vima-tech/Innate"
Repository = "https://github.com/vima-tech/Innate"
Issues = "https://github.com/vima-tech/Innate/issues"

[project.scripts]
innate = "innate_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["innate_cli"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
