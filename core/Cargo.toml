[package]
name        = "innate"
version     = "0.1.12"
edition     = "2021"
license     = "MIT"
authors     = ["vima-tech"]
description = "Innate — self-growing procedural knowledge layer for AI agents"
repository  = "https://github.com/vima-tech/Innate"
homepage    = "https://github.com/vima-tech/Innate"
documentation = "https://github.com/vima-tech/Innate#readme"
keywords    = ["mcp", "ai", "knowledge", "agent", "memory"]
categories  = ["command-line-utilities", "database"]
readme      = "../README.md"
exclude     = ["../docs/", "../sdks/", "../dist/", "../skills/"]
default-run = "innate"

[[bin]]
name = "innate"
path = "src/main.rs"

[lib]
name = "innate_core"
path = "src/lib.rs"

[dependencies]
rusqlite   = { version = "0.32", features = ["bundled"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uuid       = { version = "1", features = ["v4"] }
chrono     = { version = "0.4", features = ["serde"] }
thiserror  = "2"
sha2       = "0.11"
clap       = { version = "4", features = ["derive", "env"] }
anyhow     = "1"
dirs-next  = "2"
libc       = "0.2"
ureq       = { version = "3", features = ["json"] }
hmac       = "0.13"
tiny_http  = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
