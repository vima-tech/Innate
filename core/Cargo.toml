[package]
name        = "innate-core"
version     = "0.1.0"
edition     = "2021"
license     = "MIT"
authors     = ["vima-tech"]
description = "Innate — self-growing procedural knowledge layer"
default-run = "innate"

[[bin]]
name = "innate"
path = "src/main.rs"

[lib]
name = "innate_core"
path = "src/lib.rs"

[dependencies]
rusqlite   = { version = "0.31", features = ["bundled"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uuid       = { version = "1", features = ["v4"] }
chrono     = { version = "0.4", features = ["serde"] }
thiserror  = "1"
sha2       = "0.10"
tokio      = { version = "1", features = ["full"] }
clap       = { version = "4", features = ["derive", "env"] }
anyhow     = "1"
tracing    = "0.1"
dirs-next  = "2"

[dev-dependencies]
tempfile = "3"
